name: jewelleryyth
description: "YTH Jewellery"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  http: ^1.2.1
  intl: ^0.20.2
  get_it: ^7.7.0
  injectable: ^2.4.0
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1
  internet_connection_checker: ^1.0.0+1
  go_router: ^14.1.4
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  fl_chart: ^1.1.1
  json_annotation: ^4.11.0
  dartz: ^0.10.1
  shared_preferences: 
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
     - l10n/
  #   - images/a_dot_ham.jpeg


  # To add custom fonts to your application, add a fonts section here,
